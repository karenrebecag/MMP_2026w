<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATOM — Preview LOCAL (dist local)</title>

  <!-- Preview de DESARROLLO: carga el dist LOCAL (npm run dev), no jsDelivr. Elige el
       page-type por query param: /previews/local.html?page=industria-automotriz
       También ?lang=es|en|pt y ?theme=light|dark (defaults: home / es / light). -->
  <link rel="stylesheet" href="/dist/landing.css" />

  <!-- GSAP global: simula lo que Webflow inyecta (el bundle lo consume vía window.gsap). -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/InertiaPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MorphSVGPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div data-aa-mount data-page="home" data-aa-theme="light" data-aa-lang="es"></div>

  <!-- Aplica los query params al mount ANTES de que el bundle (type=module, diferido) haga boot. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var mount = document.querySelector('[data-aa-mount]');
      if (q.get('page')) mount.setAttribute('data-page', q.get('page'));
      if (q.get('lang')) mount.setAttribute('data-aa-lang', q.get('lang'));
      if (q.get('theme')) mount.setAttribute('data-aa-theme', q.get('theme'));
    })();
  </script>

  <!-- Bundle local (npm run dev) -->
  <script type="module" src="/dist/landing.js"></script>
</body>
</html>
